version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: trading_postgres
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trading_network
    restart: unless-stopped

  # Application Node.js
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: trading_api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://trading_user:trading_password@postgres:5432/trading_db
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - trading_network
    restart: unless-stopped
    command: npm run dev

  # pgAdmin (optionnel - pour gérer la base de données)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: trading_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@trading.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - trading_network
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:

networks:
  trading_network:
    driver: bridge
